services:

  # Service 1: PostgreSQL Database
  postgres:
    image: postgres:17
    container_name: telco-postgres

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - "127.0.0.1:5433:5432"

    volumes:
      - telco_postgres_data:/var/lib/postgresql/data


  # Service 2: Python ETL Pipeline
  pipeline:
    build:
      context: .
      dockerfile: Dockerfile

    image: telco-customer-360-pipeline:dev

    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - ./data/raw:/app/data/raw:ro

    depends_on:
      - postgres


# Named volumes
volumes:
  telco_postgres_data: